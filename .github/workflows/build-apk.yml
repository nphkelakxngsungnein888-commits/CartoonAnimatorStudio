name: Build Cartoon Animator Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug -PbuildNumber=${{ github.run_number }} -PupdateRepo=${{ github.repository }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CartoonAnimatorStudio-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find extracted -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)
          cp "$APK" CartoonAnimatorStudio.apk
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest CartoonAnimatorStudio.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest build" --notes "Build #${{ github.run_number }}"
          
